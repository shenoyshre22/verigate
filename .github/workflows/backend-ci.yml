name: backend-ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r aws/lambda/requirements.txt
      - name: Run tests
        run: python -m pytest -q backend/tests

  aws-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint SAM template (no AWS credentials needed)
        run: |
          pip install cfn-lint
          cfn-lint aws/template.yaml
