AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VERIGATE backend - HTTP API + one Lambda (FastAPI via Mangum) + DynamoDB. Do not deploy without team approval.

Parameters:
  Stage:
    Type: String
    Default: dev
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-5-5
    Description: Cross-region inference profile for explanations/summaries (aws/RECON.md). Explains only, never decides.
  BedrockFoundationModel:
    Type: String
    Default: anthropic.claude-haiku-5-5
    Description: Foundation model the profile routes to (us-east-1, us-east-2, us-west-2 per get-inference-profile).
  AllowClientEvidence:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Accept client-reported liveness scores. Keep false; true only for an engine demo without Face Liveness.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 1024

Resources:
  IdentitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub verigate-${Stage}-identities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: person_id, AttributeType: S }
        - { AttributeName: rfid_card_id, AttributeType: S }
      KeySchema:
        - { AttributeName: person_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: by-card
          KeySchema:
            - { AttributeName: rfid_card_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  AuthorizationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub verigate-${Stage}-authorization
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: person_id, AttributeType: S }
        - { AttributeName: grant_key, AttributeType: S }
      KeySchema:
        - { AttributeName: person_id, KeyType: HASH }
        - { AttributeName: grant_key, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }

  RevocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub verigate-${Stage}-revocations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: subject_id, AttributeType: S }
      KeySchema:
        - { AttributeName: subject_id, KeyType: HASH }

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub verigate-${Stage}-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: day, AttributeType: S }
        - { AttributeName: ts_attempt, AttributeType: S }
      KeySchema:
        - { AttributeName: day, KeyType: HASH }
        - { AttributeName: ts_attempt, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }

  # Enrolled face reference images (<person_id>.jpg). Private, encrypted, short-lived, never public.
  FaceRefsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub verigate-${Stage}-face-refs-${AWS::AccountId}  # S3 names are global; account ID avoids clashes
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: delete-face-refs-after-7-days
            Status: Enabled
            ExpirationInDays: 7

  FaceRefsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FaceRefsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FaceRefsBucket.Arn
              - !Sub ${FaceRefsBucket.Arn}/*
            Condition:
              Bool: { aws:SecureTransport: "false" }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub verigate-${Stage}-api
      CodeUri: .build/
      Handler: handler.handler
      Environment:
        Variables:
          IDENTITIES_TABLE: !Ref IdentitiesTable
          AUTHORIZATION_TABLE: !Ref AuthorizationTable
          REVOCATIONS_TABLE: !Ref RevocationsTable
          AUDIT_TABLE: !Ref AuditTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          FACE_REFERENCE_BUCKET: !Ref FaceRefsBucket
          ALLOW_CLIENT_EVIDENCE: !Ref AllowClientEvidence
      # Least privilege: exactly the calls the code makes (see aws/VALIDATION.md "Local integration").
      Policies:
        - Statement:
            - Sid: IdentitiesLookup          # get_item by person_id, query on GSI by-card
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !GetAtt IdentitiesTable.Arn
                - !Sub ${IdentitiesTable.Arn}/index/by-card
            - Sid: GrantsQuery               # query grants by person_id + grant_key prefix
              Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt AuthorizationTable.Arn
            - Sid: RevocationsLookup         # get_item for revocations and SYNC#<issuer> feed status
              Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !GetAtt RevocationsTable.Arn
            - Sid: AuditAppendOnly           # conditional put of records/markers, get HEAD; no delete/update/scan
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt AuditTable.Arn
            - Sid: AuditReadByDay            # reporting: query one day partition (explain / summary)
              Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt AuditTable.Arn
            - Sid: FaceLivenessAndCompare    # these Rekognition actions do not support resource-level permissions
              Effect: Allow
              Action:
                - rekognition:CreateFaceLivenessSession
                - rekognition:GetFaceLivenessSessionResults
                - rekognition:CompareFaces
                - rekognition:DetectFaces
              Resource: "*"
            - Sid: FaceReferenceReadOnly
              Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub ${FaceRefsBucket.Arn}/*
            - Sid: BedrockReportsOnly        # Converse = InvokeModel; this profile and the models it routes to only
              Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - !Sub arn:aws:bedrock:us-east-1::foundation-model/${BedrockFoundationModel}
                - !Sub arn:aws:bedrock:us-east-2::foundation-model/${BedrockFoundationModel}
                - !Sub arn:aws:bedrock:us-west-2::foundation-model/${BedrockFoundationModel}
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Base URL for the frontend (VITE_API_URL)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionName:
    Value: !Ref ApiFunction
  IdentitiesTableName:
    Value: !Ref IdentitiesTable
  AuthorizationTableName:
    Value: !Ref AuthorizationTable
  RevocationsTableName:
    Value: !Ref RevocationsTable
  AuditTableName:
    Value: !Ref AuditTable
  FaceRefsBucketName:
    Value: !Ref FaceRefsBucket
